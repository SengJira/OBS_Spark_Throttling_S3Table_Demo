repos:
  - repo: local
    hooks:
      - id: nbstripout
        name: nbstripout (strip notebook outputs)
        entry: /opt/jupyter/venv/bin/nbstripout
        language: system
        files: '\.ipynb$'
      - id: secret-scan
        name: secret-scan (passwords / keys / tokens)
        entry: bash -c 'grep -rInE "(P@ssword|password[\"'"'"'= :]+[^\"'"'"' ]{6,}|AKIA[A-Z0-9]{16,}|aws_secret_access_key[\"'"'"'= :]+[A-Za-z0-9/+=]{20,}|secret[\"'"'"'= :]+[A-Za-z0-9/+=]{20,})" "$@" && exit 1 || exit 0' --
        language: system
        pass_filenames: true
        exclude: '(\.env|credentials|\.gitignore|\.pre-commit-config\.yaml|reports/throttle_backup\.json)'
