repos:
  - repo: local
    hooks:
      - id: nbstripout
        name: nbstripout (strip notebook outputs)
        entry: /opt/jupyter/venv/bin/nbstripout
        language: system
        files: '\.ipynb$'
      - id: pyflakes
        name: pyflakes (unused imports, undefined names)
        entry: /opt/jupyter/venv/bin/python -m pyflakes
        language: system
        types: [python]
      - id: secret-scan
        name: secret-scan (passwords / keys / tokens)
        entry: bash -c 'grep -rInPi "(P@ssword|github_pat_[A-Za-z0-9_]{20,}|AKIA[A-Z0-9]{16,}|aws_secret_access_key\s*=\s*[\x22\x27]?[A-Za-z0-9/+=]{20,}|(?:password|secret|token|api[_-]?key)\s*[:=]\s*[\x22\x27][^\x22\x27]{8,})" "$@" && exit 1 || exit 0' --
        language: system
        pass_filenames: true
        exclude: '(\.env|credentials|\.gitignore|\.pre-commit-config\.yaml|reports/throttle_backup\.json)'
